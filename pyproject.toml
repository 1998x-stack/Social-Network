[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab"
version = "0.1.0"
description = "《网络》配套的共享核心库：日志、绘图、图工具、生成器、demo 入口"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "networkx>=3.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["netlab*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"第Ⅴ部分_网络过程/第17章_传染病的网络模型/17.3_SIR模型/17.3_SIR模型.py" = ["E741"]
"tests/第Ⅴ部分_网络过程/第17章_传染病的网络模型/test_17_3_SIR模型.py" = ["E741"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=netlab --cov-report=term-missing"